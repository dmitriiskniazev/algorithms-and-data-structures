[project]
name = "algorithms-and-data-structures"
version = "0.1.0"
description = "Course in algorithms and data structures"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0"]
docs = ["myst-parser>=4.0", "sphinx>=8.2"]

[tool.pytest.ini_options]
pythonpath = ["impl/python/src"]
testpaths = ["impl/python/tests"]
