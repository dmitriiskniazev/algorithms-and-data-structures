[project]
name = "algorithms-and-data-structures"
version = "0.1.0"
description = "Course in algorithms and data structures"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["algorithms", "data_structures"]
namespace = true

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "ANN"]

[tool.pyright]
include = ["src", "tests/typing/accepted.py"]
pythonVersion = "3.15"
typeCheckingMode = "strict"
reportUnnecessaryIsInstance = false
reportPrivateUsage = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[dependency-groups]
dev = [
    "pyright>=1.1.414,<2",
    "pytest>=8.0",
    "ruff>=0.17.3,<0.18",
]
docs = [
    "myst-parser>=4.0",
    "sphinx>=8.2",
    "sphinx-design>=0.6,<1",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
